name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # TODO: убрать continue-on-error, когда разберём бэклог pre-existing
      # ошибок (39 на момент добавления CI, см. PR с этим workflow) —
      # пока это просто индикатор в логе, не блокирующая проверка.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
